<!-- Standard Feature Card -->
<div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-surface-900 transition-all duration-200 hover:shadow-md">
  <div class="flex items-center justify-between">
    <span class="inline-flex items-center rounded-full bg-brand-50 px-2.5 py-0.5 text-xs font-semibold text-brand-700 dark:bg-brand-950/50 dark:text-brand-300">Active</span>
    <span class="text-xs text-content/70">Updated 2m ago</span>
  </div>
  <h4 class="mt-4 text-lg font-semibold text-slate-900 dark:text-white">Card Headline</h4>
  <p class="mt-2 text-sm text-content dark:text-slate-400">
    Clean, responsive container element designed for displaying isolated chunks of content or media.
  </p>
  <div class="mt-6 flex items-center justify-end gap-3 border-t border-slate-100 pt-4 dark:border-slate-800">
    <button class="text-sm font-medium text-content hover:text-secondary-600 dark:text-slate-400 dark:hover:text-white">Cancel</button>
    <button class="btn-primary py-1.5 px-3.5 text-xs">Confirm</button>
  </div>
</div>
