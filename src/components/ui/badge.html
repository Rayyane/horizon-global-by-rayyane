<!-- Brand Badge -->
<span class="inline-flex items-center rounded-full bg-brand-50 px-2.5 py-0.5 text-xs font-semibold text-brand-700 ring-1 ring-inset ring-brand-700/10 dark:bg-brand-950/50 dark:text-brand-300 dark:ring-brand-400/20">
  Brand
</span>

<!-- Secondary Badge -->
<span class="inline-flex items-center rounded-full bg-secondary-50 px-2.5 py-0.5 text-xs font-semibold text-secondary-700 ring-1 ring-inset ring-secondary-700/20 dark:bg-secondary-950/50 dark:text-secondary-300 dark:ring-secondary-400/30">
  Secondary
</span>

<!-- Success Badge -->
<span class="inline-flex items-center rounded-full bg-emerald-50 px-2.5 py-0.5 text-xs font-semibold text-emerald-700 ring-1 ring-inset ring-emerald-600/20 dark:bg-emerald-950/50 dark:text-emerald-300 dark:ring-emerald-500/20">
  Completed
</span>

<!-- Warning Badge -->
<span class="inline-flex items-center rounded-full bg-amber-50 px-2.5 py-0.5 text-xs font-semibold text-amber-800 ring-1 ring-inset ring-amber-600/20 dark:bg-amber-950/50 dark:text-amber-300 dark:ring-amber-500/20">
  In Review
</span>

<!-- Danger Badge -->
<span class="inline-flex items-center rounded-full bg-rose-50 px-2.5 py-0.5 text-xs font-semibold text-rose-700 ring-1 ring-inset ring-rose-600/10 dark:bg-rose-950/50 dark:text-rose-300 dark:ring-rose-500/20">

</span>
